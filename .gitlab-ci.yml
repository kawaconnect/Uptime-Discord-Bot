# Checks and container image for Uptime-Discord-Bot, built on GitLab and
# published to the GitLab registry only.
#
# GitHub is a plain code mirror (no Actions, no GHCR), so this is the only thing
# that builds these images. Pipelines run
# on a v* tag, or manually from the UI/API (set RELEASE_VERSION=v1.2.3 to stamp
# a version without tagging, DOCKER_PUSH=false to build without publishing).
# The workflow rules and stages (test, build, release) come from the shared
# template.
#
# The test stage audits dependencies, type-checks, lints, runs the test suite
# (including the SiteGuard fixture replay) and compiles the bot on the same
# Node the Dockerfile uses; the image only builds once that passes. The smoke
# script also loads the compiled better-sqlite3 native binding, the one
# dependency that can fail to install on Alpine.
#
# Merge requests (e.g. Renovate MRs) also get a pipeline, via the template's
# workflow rules: tests and image builds only. The template never pushes
# or releases from an MR pipeline, and release jobs here are
# kept off MRs.

include:
  - project: dean/ci-templates
    ref: main
    file: /docker.yml

# Same base image as both Dockerfile stages.
check:
  stage: test
  tags: [linux]
  image: node:26-alpine
  interruptible: true
  variables:
    GIT_DEPTH: "1"
  cache:
    key: npm
    paths: [.npm/]
  script:
    - node --version
    # npm ci installs exactly package-lock.json, as the Dockerfile does.
    - npm ci --no-audit --no-fund --cache .npm --prefer-offline
    # Fails the release on a high/critical advisory (the repo is kept at 0).
    - npm audit --audit-level=high
    - npm run typecheck
    - npm run lint
    - npm test
    - npm run build
    - sh ci/smoke.sh

build:
  extends: .docker-build
  parallel:
    matrix:
    - IMAGE: uptime-discord-bot
      CONTEXT: .
